<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813" />
      <stop offset="40%" stop-color="#0a1226" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Animated Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#34d399;#818cf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="stop-color" values="#34d399;#38bdf8;#818cf8;#34d399" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Robotic Laser Glow Filter -->
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Isometric Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>

    <style>
      .kinematic-sweep {
        animation: rotateArm 7s ease-in-out infinite alternate;
        transform-origin: 1020px 240px;
      }
      .kinematic-forearm {
        animation: rotateForearm 5s ease-in-out infinite alternate;
        transform-origin: 970px 170px;
      }
      @keyframes rotateArm {
        0% { transform: rotate(-12deg); }
        100% { transform: rotate(20deg); }
      }
      @keyframes rotateForearm {
        0% { transform: rotate(18deg); }
        100% { transform: rotate(-25deg); }
      }
      .laser-pulse {
        animation: laserFlicker 1.8s ease-in-out infinite alternate;
      }
      @keyframes laserFlicker {
        0% { opacity: 0.3; stroke-width: 1.5; }
        100% { opacity: 0.95; stroke-width: 3.5; }
      }
      .pulse-ring {
        animation: ringPulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: 1020px 240px;
      }
      @keyframes ringPulse {
        0% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 0.1; }
        100% { transform: scale(0.9); opacity: 0.8; }
      }
      .path-dash {
        stroke-dasharray: 8 6;
        animation: dashMove 14s linear infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Left Side Industrial Architecture / Cell Flow -->
  <g opacity="0.6">
    <path d="M -50 80 Q 200 40 380 120 T 600 90" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" class="path-dash" />
    <path d="M -50 280 Q 220 310 420 250 T 650 280" fill="none" stroke="rgba(192, 132, 252, 0.15)" stroke-width="2" class="path-dash" />
  </g>

  <!-- Central Content Box -->
  <g transform="translate(100, 65)">
    <!-- Subtitle Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="370" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
      <circle cx="16" cy="15" r="5" fill="#38bdf8" filter="url(#laserGlow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="19.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">
        INDUSTRIAL ROBOT CELL SIMULATION &amp; OLP
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      Awesome Robot Cell Simulation
    </text>

    <!-- Description -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated Digital Twins, Offline Programming (OLP), Motion Planning &amp; Kinematics
    </text>
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#64748b">
      Industrial Robotics • Virtual Commissioning • CAD Toolpath • Physics Engines • ROS 2
    </text>

    <!-- Pills / Category Badges -->
    <g transform="translate(0, 185)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="140" height="34" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="70" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#38bdf8" text-anchor="middle">🦾 Robot Arms</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(152, 0)">
        <rect width="145" height="34" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#818cf8" stroke-width="1.2"/>
        <text x="72.5" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#a5b4fc" text-anchor="middle">🌐 Digital Twins</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(309, 0)">
        <rect width="145" height="34" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#c084fc" stroke-width="1.2"/>
        <text x="72.5" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#e9d5ff" text-anchor="middle">⚙️ Kinematics</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(466, 0)">
        <rect width="165" height="34" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#34d399" stroke-width="1.2"/>
        <text x="82.5" y="21.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">🔌 Virtual PLC / HIL</text>
      </g>
    </g>
  </g>

  <!-- Right Side Interactive Robot Workcell Illustration -->
  <g transform="translate(80, 0)">
    <!-- Safety Enclosure Floor -->
    <ellipse cx="940" cy="285" rx="140" ry="45" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    <ellipse cx="940" cy="285" rx="180" ry="60" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-dasharray="6 4" />
    
    <!-- Base Pedestal -->
    <rect x="915" y="240" width="50" height="40" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="940" cy="240" r="22" fill="#0f172a" stroke="#818cf8" stroke-width="2" />

    <!-- Articulated Robot Arm -->
    <!-- Joint 1 Base -->
    <circle cx="940" cy="240" r="14" fill="#38bdf8" filter="url(#laserGlow)" />
    
    <!-- Link 1 & Joint 2 -->
    <g class="kinematic-sweep">
      <rect x="933" y="165" width="14" height="75" rx="6" fill="#334155" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="940" cy="165" r="12" fill="#1e293b" stroke="#818cf8" stroke-width="2" />
      <circle cx="940" cy="165" r="6" fill="#818cf8" />

      <!-- Forearm & Tool -->
      <g class="kinematic-forearm">
        <rect x="934" y="95" width="12" height="70" rx="5" fill="#475569" stroke="#c084fc" stroke-width="1.2" />
        <circle cx="940" cy="95" r="9" fill="#0f172a" stroke="#34d399" stroke-width="1.8" />
        
        <!-- End Effector / Tool (Welder / Gripper) -->
        <polygon points="935,95 945,95 943,72 937,72" fill="#38bdf8" />
        <!-- Tool Center Point (TCP) Laser Beam -->
        <line x1="940" y1="72" x2="880" y2="18" stroke="#f43f5e" stroke-width="2.5" class="laser-pulse" filter="url(#laserGlow)" />
        <circle cx="880" cy="18" r="4" fill="#f43f5e" filter="url(#strongGlow)">
          <animate attributeName="r" values="3;6;3" dur="0.8s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>

    <!-- Workcell Part / Fixture -->
    <rect x="850" y="235" width="40" height="25" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <path d="M 855 235 L 870 215 L 885 235 Z" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1" />
  </g>
</svg>
